{% extends "base.html" %}

{% block title %}使用者管理{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">👥 使用者管理</h1>

<form action="/add_user" method="post" class="mb-4">
  <input name="participant" required placeholder="輸入名稱" class="border px-2 py-1 mr-2">
  <button class="bg-blue-500 text-white px-4 py-1 rounded">新增</button>
</form>

<ul class="list-disc pl-6">
  {% for name in participants %}
  <li class="mb-1">
    {{ name }}
    <form action="/delete_user" method="post" class="inline">
      <input type="hidden" name="participant" value="{{ name }}">
      <button class="text-red-500 ml-2">刪除</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% endblock %}
