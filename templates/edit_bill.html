{% extends "base.html" %}

{% block title %}編輯帳目{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">✏️ 編輯帳目</h1>

<form action="/update_bill/{{ idx }}" method="post" class="space-y-3">
  <div>
    <label>付款人：</label>
    <select name="payer" class="border p-1">
      {% for p in participants %}
      <option value="{{ p }}" {% if p == record.payer %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label>金額：</label>
    <input name="amount" type="number" step="0.01" value="{{ record.amount }}" class="border p-1">
  </div>

  <div>
    <label>項目：</label>
    <input name="item" value="{{ record.item }}" class="border p-1">
  </div>

  <div>
    <label>參與者：</label><br>
    {% for p in participants %}
    <label class="mr-4">
      <input type="checkbox" name="participants" value="{{ p }}" {% if p in checked %}checked{% endif %}> {{ p }}
    </label>
    {% endfor %}
  </div>

  <button class="bg-blue-600 text-white px-4 py-1 rounded">更新</button>
  <a href="/add_bill" class="ml-4 text-gray-600 underline">取消</a>
</form>
{% endblock %}
