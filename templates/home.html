<h2>Manage Participants</h2>
<form id="add-participant-form">
    <label for="new-participant">New Participant:</label>
    <input type="text" id="new-participant" name="new-participant" required>
    <button type="submit">Add Participant</button>
</form>

<h2>Current Participants</h2>
<ul id="participants-list"></ul>

<form id="delete-participant-form">
    <label for="delete-participant">Delete Participant:</label>
    <input type="text" id="delete-participant" name="delete-participant" required>
    <button type="submit">Delete Participant</button>
</form>

<h2>Manage Expenses</h2>
<button id="refresh-expenses">Refresh Expenses</button>

<form id="delete-expense-form">
    <label for="delete-expense-index">Expense Index to Delete:</label>
    <input type="number" id="delete-expense-index" name="delete-expense-index" required>
    <button type="submit">Delete Expense</button>
</form>
